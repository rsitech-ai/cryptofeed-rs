[package]
name = "marketfeed-adapter-deribit"
description = "Deribit derivatives market-data adapter (deterministic SessionMachine)"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Compatibility feature name; financial JSON always retains original lexical
# tokens with RawValue. A float-based SIMD DOM is not an exact substitute.
simd-json = []

[dependencies]
bytes = { workspace = true }
marketfeed-adapter-api = { workspace = true }
marketfeed-book = { workspace = true }
marketfeed-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
marketfeed-recording = { workspace = true }
marketfeed-dispatch = { workspace = true }
marketfeed-engine = { path = "../../engine" }
marketfeed-replay = { workspace = true }
marketfeed-transport = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
