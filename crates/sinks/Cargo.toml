[package]
name = "marketfeed-sinks"
description = "External EventSink: Memory/Logging/File/ProtobufFile/ProtobufBinaryFile/Udp/SpillWal + optional Kafka/NATS TCP clients"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Minimal sync TCP clients (no rdkafka / async-nats). Off ⇒ SinkError::Unsupported.
kafka = []
nats = []

[dependencies]
marketfeed-adapter-api = { workspace = true }
marketfeed-dispatch = { workspace = true }
marketfeed-model = { workspace = true }
marketfeed-recording = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
