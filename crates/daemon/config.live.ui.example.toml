# Example live multi-venue + market panel UI config.
# Copied to `.local/live-ui/config.live.ui.toml` by `scripts/run_live_ui.sh` when missing.
#
# Public venues only — no secrets. Recording disabled for interactive sessions.
# Edit the local copy freely; it is gitignored under `.local/`.
#
# L2 policy (honest):
# - L2 is enabled on the public spot fallback and the three qualified BTC/major
#   perpetual paths (Binance USD-M, OKX Swap, Bybit Linear).
# - Bybit subscribe args are chunked ≤10 (spot rejects larger batches).
# - Binance USD-M/Coin-M use @trade (fstream/dstream @aggTrade is silent).

[engine]
runtime_profile = "portable"
shutdown_deadline_secs = 20

[telemetry]
log_format = "json"
log_level = "info"
bind = "127.0.0.1:19108"
ui_bind = "127.0.0.1:19109"
ui_tape_capacity = 1024
ui_tape_max_per_sec = 200
ui_static_dir = "./ui/dist"
# Optional Grafana deep-link for the SPA status bar.
# grafana_base_url = "http://127.0.0.1:3000"

[readiness]
require_running = true
require_required_venues = true
min_live_sessions = 1
require_recording_healthy = false

[recording.raw]
enabled = false
directory = "./.local/live-ui/raw"
segment_size = "256MiB"
segment_duration = "15m"
queue_capacity = 8192
overflow = "fail_engine"
min_free_space = "0"


[[venues]]
id = "binance-spot"
adapter = "binance"
segment = "spot"
required = false
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"]
channels = ["trades", "quote", "l2"]

