# Example marketfeed daemon config (loopback metrics only).
#
# Offline CI path: keep only [[venues]] synthetic (required=true).
# Live venues need network; leave required=false unless intentionally driving readiness.
#
# Hot reload (Unix): SIGHUP re-validates this file. Applies log_level + [readiness]
# in-process; venues/sinks/recording/runtime_profile/bind require process restart.

[engine]
# portable (default) | latency (Linux pin_worker_to_core; see docs/ops/latency_runtime.md)
runtime_profile = "portable"
shutdown_deadline_secs = 20

[telemetry]
log_format = "json"
log_level = "info"
bind = "127.0.0.1:9108"
# Optional loopback view API / SPA (requires `--features ui-api` or `ui`).
# When unset, /v1/* shares `bind` if the feature is compiled in.
# ui_bind = "127.0.0.1:9109"
# ui_tape_capacity = 256
# ui_tape_max_per_sec = 50
# ui_static_dir = "./ui/dist"

[readiness]
require_running = true
require_required_venues = true
min_live_sessions = 1
require_recording_healthy = false

[recording.raw]
enabled = false
directory = "./raw"
segment_size = "256MiB"
segment_duration = "15m"
queue_capacity = 8192
overflow = "fail_engine"
min_free_space = "0"

# Optional: replace null-drain with bounded sinks (always drains dispatch).
# [[sinks]]
# id = "probe"
# type = "memory"
# required = false
# capacity = 1024
# overflow = "drop_oldest"
# [[sinks]]
# type = "logging"
# capacity = 64
# overflow = "drop_newest"
# [[sinks]]
# id = "primary-file"
# type = "file"
# required = true
# path = "./events.log"
# capacity = 1024
# overflow = "fail_engine"
# [[sinks]]
# type = "protobuf-file"
# path = "./events.mfpe"
# capacity = 1024
# overflow = "fail_engine"
# [[sinks]]
# type = "protobuf-file-bin"
# path = "./events.mfpeb"
# capacity = 1024
# overflow = "fail_engine"
# [[sinks]]
# type = "udp"
# address = "127.0.0.1:19090"
# capacity = 1024
# overflow = "drop_newest"
#
# Every configured sink has an isolated bounded FIFO and worker. `id` values,
# when supplied, must be unique. A failed `required = true` sink makes /ready
# return 503; optional sink failures remain visible in marketfeed_sink_* metrics.
# At most 64 sinks are accepted. Recording plus sink mailboxes and their batch/
# system queues may reserve at most 1,048,576 eager queue slots process-wide.
# Standalone type="spill-wal" is rejected because it has no recovery consumer.
# Kafka/NATS need daemon features `kafka` / `nats` (TCP clients; no rdkafka/async-nats).
# [[sinks]]
# type = "kafka"
# address = "127.0.0.1:9092"
# topic = "marketfeed"
# capacity = 1024
# overflow = "drop_newest"
# [[sinks]]
# type = "nats"
# address = "127.0.0.1:4222"
# subject = "marketfeed.events"
# capacity = 1024
# overflow = "drop_newest"

# Reserved private user-data flags (credentials are env-only).
# All daemon private sessions currently fail validation: Binance needs the
# authenticated WS API migration; OKX/Bybit need a durable account sink,
# readiness/liveness tracking, and reconnect supervision. No order placement.
# [private.binance_spot]
# enabled = false
# [private.okx_spot]
# enabled = false
# [private.bybit_spot]
# enabled = false

[[venues]]
id = "synthetic-demo"
adapter = "synthetic"
required = true

[[venues]]
id = "binance-spot"
adapter = "binance"
segment = "spot"
required = false
symbols = ["BTCUSDT", "ETHUSDT"]
channels = ["trades", "quote", "l2"]

