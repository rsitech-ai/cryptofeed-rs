# Live canary config: Binance Spot + OKX Spot only (no synthetic).
# Operator-local; not used by offline CI.
# Evidence run used bind 127.0.0.1:19277 — override bind for concurrent runs.

[engine]
runtime_profile = "portable"
shutdown_deadline_secs = 20

[telemetry]
log_format = "json"
log_level = "info"
bind = "127.0.0.1:19278"

[readiness]
require_running = true
require_required_venues = true
min_live_sessions = 2
require_recording_healthy = false

[recording.raw]
enabled = false
directory = "./raw"
segment_size = "64MiB"
segment_duration = "5m"
queue_capacity = 1024
overflow = "fail_engine"
min_free_space = "0"

[[venues]]
id = "binance-spot"
adapter = "binance"
segment = "spot"
required = true
symbols = ["BTCUSDT"]
channels = ["trades", "quote"]

[[venues]]
id = "okx-spot"
adapter = "okx"
segment = "spot"
required = true
symbols = ["BTC-USDT"]
channels = ["trades", "ticker"]
