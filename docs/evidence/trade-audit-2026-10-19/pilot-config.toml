[engine]
shutdown_deadline_secs = 20
[telemetry]
bind = "127.0.0.1:19348"
log_level = "info"
log_format = "json"
[readiness]
min_live_sessions = 1
require_recording_healthy = true
[recording.raw]
enabled = true
queue_capacity = 8192
overflow = "fail_engine"
segment_size = "16MiB"
segment_duration = "60s"
min_free_space = "1GiB"
directory = "${WORKSPACE_ROOT}/.local/evidence/trade-audit/pilot-001/raw"
[[sinks]]
id = "audit-file"
type = "file"
required = true
capacity = 8192
overflow = "fail_engine"
path = "${WORKSPACE_ROOT}/.local/evidence/trade-audit/pilot-001/events.jsonl"

