# Supply-chain baseline for marketfeed (licenses, advisories, sources).
# Spec: docs/spec §28 / §29. Duplicate versions fail by default. Explicit,
# version-pinned transitive exceptions keep the release gate quiet and become
# unnecessary-skip warnings when upstream graphs converge.
# wildcards: cargo-deny treats `{ workspace = true }` / path deps as wildcards;
# keep allow and ban real `*` crates.io pins in review.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
# RUSTSEC-2026-0009 is confined to time's well_known::Rfc2822 parser.
# EventPulse imports only OffsetDateTime + well_known::Rfc3339, rejects RFC2822
# at its boundary, and guards its Rust source against adding Rfc2822. Patched
# time >=0.3.47 requires Rust >=1.88, above the frozen workspace Rust 1.85 MSRV.
# Remove this exact exception and update time when the MSRV advances to 1.88.
ignore = [
    { id = "RUSTSEC-2026-0009", reason = "RFC2822 parser is unreachable; time >=0.3.47 requires Rust 1.88, so remove when workspace MSRV reaches 1.88" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]
skip = [
    { crate = "getrandom@0.2.17", reason = "ring and proptest currently require incompatible getrandom major versions" },
    { crate = "getrandom@0.4.3", reason = "tempfile 3.27 requires getrandom 0.4 while rand and tungstenite remain on getrandom 0.3" },
    { crate = "hashbrown@0.15.5", reason = "simd-json currently requires hashbrown 0.15 while the remaining graph uses 0.17" },
    { crate = "syn@2.0.119", reason = "transitive procedural macro dependencies currently span syn 2 and syn 3" },
    { crate = "webpki-roots@0.26.11", reason = "tokio-tungstenite 0.26 and reqwest 0.12 currently resolve different webpki-roots majors" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
