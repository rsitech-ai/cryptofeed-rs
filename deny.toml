# Supply-chain baseline for marketfeed (licenses, advisories, sources).
# Spec: docs/spec §28 / §29. Duplicate versions fail by default. Explicit,
# version-pinned transitive exceptions keep the release gate quiet and become
# unnecessary-skip warnings when upstream graphs converge.
# wildcards: cargo-deny treats `{ workspace = true }` / path deps as wildcards;
# keep allow and ban real `*` crates.io pins in review.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
# Timestamp consumers use the already-locked Chrono backend. The vulnerable
# former backend and its exact advisory exception have been removed without
# raising the collector/core Rust 1.85 MSRV.
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]
skip = [
    { crate = "windows-sys@0.59.0", reason = "fs4 0.13 Windows file locking needs bindings 0.59 while std-adjacent dependencies and the checked directory backend use 0.61; exposed by adding Windows to the audited target graph" },
    { crate = "getrandom@0.2.17", reason = "ring and proptest currently require incompatible getrandom major versions" },
    { crate = "getrandom@0.4.3", reason = "tempfile 3.27 requires getrandom 0.4 while rand and tungstenite remain on getrandom 0.3" },
    { crate = "hashbrown@0.15.5", reason = "simd-json currently requires hashbrown 0.15 while the remaining graph uses 0.17" },
    { crate = "hashbrown@0.16.1", reason = "offline jsonschema referencing 0.45 uses hashbrown 0.16 while the collector graph uses 0.17" },
    { crate = "foldhash@0.1.5", reason = "simd-json hashbrown 0.15 uses foldhash 0.1 while offline schema validation uses foldhash 0.2" },
    { crate = "num-bigint@0.4.8", reason = "jsonschema fraction uses num-bigint 0.4 while Parquet 60 uses num-bigint 0.5" },
    { crate = "syn@2.0.119", reason = "transitive procedural macro dependencies currently span syn 2 and syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
