# Offline soak skeleton (spec §27.9 / §3.7).
# Runs synthetic `marketfeed run` mini-soak (no exchange I/O).
# Multi-day live soak remains an ops runbook sign-off.

name: soak-skeleton

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      duration_hint:
        description: "Human duration hint for live soak (ops) — offline job uses SOAK_SECS"
        required: false
        default: "1h"
      soak_secs:
        description: "Offline synthetic hold seconds"
        required: false
        default: "5"

jobs:
  offline-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Offline synthetic soak
        env:
          DURATION_HINT: ${{ github.event.inputs.duration_hint }}
          SOAK_SECS: ${{ github.event.inputs.soak_secs || '5' }}
          MARKETFEED_BIND_PORT: "19108"
        run: |
          set -euo pipefail
          [[ "$SOAK_SECS" =~ ^[0-9]+$ ]]
          (( SOAK_SECS >= 1 && SOAK_SECS <= 3600 ))
          printf 'Duration hint (ops live soak): %s\n' "$DURATION_HINT"
          echo "See docs/ops/soak_runbook.md"
          ./scripts/offline_daemon_e2e.sh
