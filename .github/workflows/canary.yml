# Canary skeleton (spec §27.8 / §28.2).
# Default path is offline synthetic (no exchange I/O).
# Live venue canaries stay dispatch-only until secrets + allowlists exist.

name: canary

permissions:
  contents: read

on:
  schedule:
    # Daily 06:00 UTC — offline synthetic until live venues are wired.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      venue:
        description: "Venue allowlist key (synthetic|binance-spot|…)"
        required: false
        default: "synthetic"
      soak_secs:
        description: "Hold seconds for offline synthetic canary"
        required: false
        default: "3"

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-offline:
    name: canary synthetic offline
    if: ${{ github.event_name == 'schedule' || github.event.inputs.venue == 'synthetic' || github.event.inputs.venue == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Run offline synthetic canary
        env:
          SOAK_SECS: ${{ github.event.inputs.soak_secs || '3' }}
          MARKETFEED_BIND_PORT: "19118"
        run: |
          set -euo pipefail
          [[ "$SOAK_SECS" =~ ^[0-9]+$ ]]
          (( SOAK_SECS >= 1 && SOAK_SECS <= 300 ))
          ./scripts/offline_daemon_e2e.sh

  live-placeholder:
    name: canary live placeholder
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.venue != 'synthetic' && github.event.inputs.venue != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fail closed until a live canary is implemented
        env:
          REQUESTED_VENUE: ${{ github.event.inputs.venue }}
        run: |
          echo "::error::Live canary for venue=${REQUESTED_VENUE} is not implemented."
          echo "A requested live canary must never report success without executing the venue gate."
          exit 1
