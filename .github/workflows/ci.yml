name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Primary matrix: Linux x86_64, macOS, Windows, Linux aarch64 (hosted arm).
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --all-features

  # Optional C10 feature matrix: adapter crates with `--features simd-json`.
  # Local parity: the same cargo lines are documented in latency_runtime.md.
  simd-json:
    name: simd-json (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - marketfeed-adapter-binance
          - marketfeed-adapter-okx
          - marketfeed-adapter-bybit
          - marketfeed-adapter-kraken
          - marketfeed-adapter-deribit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: simd-json-${{ matrix.crate }}
      - run: cargo test -p ${{ matrix.crate }} --features simd-json
      # Evidence tool compile-check only (Binance harness); do not gate on timings.
      - name: parse_fixtures bench (compile + one run)
        if: matrix.crate == 'marketfeed-adapter-binance'
        run: |
          cargo bench -p marketfeed-adapter-binance --bench parse_fixtures
          cargo bench -p marketfeed-adapter-binance --bench parse_fixtures --features simd-json

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85
      # ponytail: MSRV = compile+lib tests only; full --workspace --all-targets stays on pin toolchain.
      - run: cargo test --workspace --lib

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Advisory: do not block merge on SBOM tooling flakiness.
  sbom:
    name: sbom (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: sbom
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: ./scripts/generate-sbom.sh
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketfeed-sbom
          path: sbom/
          if-no-files-found: warn
